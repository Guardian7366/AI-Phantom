[project]
name = "ai_phantom"
version = "0.1.0"
description = "AI Phantom - PPO+CNN maze explorer (no gymnasium)"
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numpy",
  "pygame-ce",
  "pyyaml",
  "tqdm",
  "torch",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_phantom*"]
